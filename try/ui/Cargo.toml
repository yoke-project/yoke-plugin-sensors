# The application's panel: an interface client of the sensors Plugin, attached to a channel of the
# application. It reaches the Plugin through the contract alone and links none of its code.
[package]
name = "sensors-ui"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
slint = "~1.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde_json = "1"
yoke-sdk = "=0.8.0"
# What a subscription carries, which the library does not name.
yoke-proto = "=0.6.0"

[build-dependencies]
slint-build = "~1.18"

# A program of its own, never a member of a workspace around it.
[workspace]
